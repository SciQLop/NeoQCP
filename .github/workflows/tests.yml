name: Tests

on:
  release:
    types: [ published ]
  push:
  pull_request:

env:
  QT_VERSION: 6.11.2

jobs:
  build_and_test:
    name: Build and test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            qt_host: linux
            qt_dir: gcc_64
          - os: ubuntu-24.04-arm
            arch: aarch64
            qt_host: linux_arm64
            qt_dir: gcc_arm64
          - os: windows-latest
            arch: x86_64
            qt_host: windows
            qt_dir: msvc2022_64
          - os: macos-15-intel  # Intel
            arch: x86_64
            qt_host: mac
            qt_dir: macos
          - os: macos-latest # Apple Silicon; follows GitHub's current macOS, no migration per release
            arch: arm64
            qt_host: mac
            qt_dir: macos
    steps:
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: amd64
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.14: aqt tries zipfile before py7zr, and older zipfile.is_zipfile() takes some Qt .7z
          # archives for zips (6.11.2 qttools on linux_arm64), then fails to open them.
          python-version: '3.14'
      - name: Install build tools
        # aqtinstall 3.3.0 cannot read the Qt 6.11 repository layout; master can (as in SciQLopPlots).
        run: pip install "aqtinstall @ git+https://github.com/miurahr/aqtinstall.git@master" meson ninja

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: Qt
          key: qt-${{ env.QT_VERSION }}-${{ matrix.qt_host }}-${{ matrix.qt_dir }}
      - name: Install Qt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [ "${{ matrix.qt_host }}" = "windows" ]; then
            aqt install-qt -O Qt ${{ matrix.qt_host }} desktop ${{ env.QT_VERSION }} win64_msvc2022_64 -m qtshadertools
          else
            aqt install-qt -O Qt ${{ matrix.qt_host }} desktop ${{ env.QT_VERSION }} -m qtshadertools
          fi

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update && sudo apt install -y ccache libgl-dev xvfb libatomic1 libglx-dev libegl-dev libxrandr2 libxss1 libxcursor1 libxcomposite1 libasound2-dev libxi6 libxtst6 libglib2.0-bin libdbus-1-3 libxdamage1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libnss3

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.os }}

      - name: Set up environment (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "$GITHUB_WORKSPACE/Qt/${{ env.QT_VERSION }}/${{ matrix.qt_dir }}/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/Qt/${{ env.QT_VERSION }}/${{ matrix.qt_dir }}/lib" >> $GITHUB_ENV
          echo "QT_QPA_PLATFORM=offscreen" >> $GITHUB_ENV
      - name: Set up environment (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "$env:GITHUB_WORKSPACE\Qt\$env:QT_VERSION\${{ matrix.qt_dir }}\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          echo "QT_QPA_PLATFORM=offscreen" >> $env:GITHUB_ENV
          # offscreen loads fonts only from QT_QPA_FONTDIR (Qt's own fonts dir by default, absent
          # here): without it every glyph is a box and text comparisons test nothing.
          echo "QT_QPA_FONTDIR=C:\Windows\Fonts" >> $env:GITHUB_ENV
      - name: Set up environment (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "$GITHUB_WORKSPACE/Qt/${{ env.QT_VERSION }}/${{ matrix.qt_dir }}/bin" >> $GITHUB_PATH
          echo "DYLD_FALLBACK_FRAMEWORK_PATH=$GITHUB_WORKSPACE/Qt/${{ env.QT_VERSION }}/${{ matrix.qt_dir }}/lib" >> $GITHUB_ENV
          echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> $GITHUB_ENV
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            # Intel macOS runners are virtualized, and Apple's paravirtualized Metal
            # driver there has crashed a plain QWidget::show() outright (unrelated to
            # this project: an uncaught NSException inside AppleParavirtGPUMetal).
            # Keep offscreen here; it gets no real Metal device either, but it does not
            # abort the whole test binary.
            echo "QT_QPA_PLATFORM=offscreen" >> $GITHUB_ENV
          fi
          # No offscreen on Apple Silicon: it carries a real, logged-in GUI session and
          # a real (non-virtualized) Metal device, unlike offscreen (no QRhi at all) or
          # the Intel runner above (virtualized, unreliable). The default cocoa platform
          # uses that session.

      - name: Build
        run: |
          meson setup --buildtype debugoptimized build
          meson compile -C build
      - name: Test
        shell: bash
        env:
          QCP_TEST_LOG_DIR: ${{ github.workspace }}/testlogs
        run: |
          mkdir -p "$QCP_TEST_LOG_DIR"
          meson test -v --no-rebuild -C build
      # QtTest output never shows on the Windows runners; print each failing class's log.
      - name: Show failing test classes
        if: failure()
        shell: bash
        run: |
          for f in "$GITHUB_WORKSPACE"/testlogs/*.txt; do
            if grep -q "^FAIL!" "$f"; then
              echo "::group::$(basename "$f")"
              cat "$f"
              echo "::endgroup::"
            fi
          done
          grep -h "^Totals:" "$GITHUB_WORKSPACE"/testlogs/*.txt || true
      - name: Keep the test logs and mismatching pictures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testlogs-${{ matrix.os }}
          path: testlogs/
