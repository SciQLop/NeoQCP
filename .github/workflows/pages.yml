name: Pages

# Builds the gallery to WebAssembly and publishes it to GitHub Pages:
# https://sciqlop.github.io/NeoQCP/ (the docs' "Try it online" buttons point here).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  QT_VERSION: '6.11.2'
  EMSDK_VERSION: '4.0.7'   # the version Qt 6.11's wasm binaries are built with

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.14: older zipfile.is_zipfile() takes some Qt .7z archives for zips.
          python-version: '3.14'
      - name: Install build tools
        # aqtinstall 3.3.0 cannot read the Qt 6.11 repository layout; master can.
        run: pip install "aqtinstall @ git+https://github.com/miurahr/aqtinstall.git@master" meson ninja

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: Qt
          key: qt-${{ env.QT_VERSION }}-wasm-multithread
      - name: Install Qt (host tools + wasm)
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          aqt install-qt -O Qt linux desktop ${{ env.QT_VERSION }} -m qtshadertools
          aqt install-qt -O Qt all_os wasm ${{ env.QT_VERSION }} wasm_multithread

      - name: Install the host Qt tools' system libraries
        # qsb links QtGui, which needs EGL/GL and xkbcommon even to compile shaders.
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0

      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: Build the gallery
        # The wasm Qt's qmake finds the host tools in Qt/<version>/gcc_64 (its target_qt.conf).
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          printf "[constants]\nqt_wasm = '%s'\n" "$PWD/Qt/${{ env.QT_VERSION }}/wasm_multithread" > qt.ini
          meson setup build-wasm --cross-file qt.ini --cross-file examples/wasm-gallery/emscripten.ini
          meson compile -C build-wasm

      - name: Assemble site
        run: examples/wasm-gallery/build_site.sh build-wasm/examples/wasm-gallery _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
