# Meson cross file for Qt for WebAssembly (multithread) with Emscripten.
# It needs the Qt location from a cross file given before it, e.g. qt.ini:
#   [constants]
#   qt_wasm = '/home/me/Qt/6.11.2/wasm_multithread'
# Emscripten's emcc/em++ must be on PATH (source emsdk_env.sh).

[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
ranlib = 'emranlib'
qmake = qt_wasm / 'bin/qmake'
qmake6 = qt_wasm / 'bin/qmake'

[built-in options]
b_ndebug = 'if-release'
# Qt's multithread build: every object shares memory with the web workers. The gallery is a
# release build: QT_NO_DEBUG drops Q_ASSERT, as Qt's CMake does for Release (NDEBUG does not).
c_args = ['-pthread']
cpp_args = ['-pthread', '-DQT_NO_DEBUG']
cpp_link_args = ['-pthread']

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'
